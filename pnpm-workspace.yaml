packages:
  - "apps/*"
  - "backend/*"
  - "packages/*"

# pnpm 10 blocks lifecycle scripts by default; these packages need them to build native bindings.
onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - sharp

# Single source of truth for versions shared across all workspace packages.
catalog:
  typescript: ^5.9.3
  "@types/node": ^20
  "@types/express": ^5.0.6
  "@types/cookie-session": ^2.0.49
  "@types/cors": ^2.8.19
