packages:
  - "apps/*"
  - "backend/*"
  - "packages/*"
  - "infra"
  - "core"

# pnpm 10 blocks lifecycle scripts by default; these packages need them to build native bindings.
onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - sharp

# ─────────────────────────────────────────────────────────────
# Single source of truth for ALL dependency versions.
# Every workspace package references these via "catalog:" — bump a version
# here once and it applies everywhere. Do NOT pin versions in package.json.
# ─────────────────────────────────────────────────────────────
catalog:
  # Tooling
  typescript: ^5.9.3
  tsx: ^4.23.1
  tsup: ^8.5.1

  # Type definitions
  "@types/node": ^20
  "@types/express": ^5.0.6
  "@types/cors": ^2.8.19
  "@types/cookie-session": ^2.0.49
  "@types/dotenv": ^6.1.1
  "@types/jsonwebtoken": ^9.0.10
  "@types/multer": ^2.2.0
  "@types/opossum": ^8.1.9
  "@types/bcrypt": ^6.0.0
  "@types/cookie-parser": ^1.4.10

  # Shared runtime dependencies
  express: ^5.2.1
  jsonwebtoken: ^9.0.3
  cookie-session: ^2.1.1
  cors: ^2.8.6
  dotenv: ^17.4.2
  axios: ^1.18.1
  multer: ^2.2.0
  opossum: ^5.0.1
  datauri: ^4.1.0
  cookie-parser: ^1.4.7
  bcrypt: ^6.0.0
  googleapis: ^173.0.0
  express-rate-limit: ^8.7.0
  serverless-http: ^4.0.0

  # Single-consumer runtime dependencies (cataloged for consistency)
  cloudinary: ^2.10.0
  razorpay: ^2.9.6
  stripe: ^22.3.1
  rate-limit-redis: ^6.0.1
  "@aws-sdk/client-lambda": ^3.1141.0

  # AWS serverless runtime (DynamoDB, SQS, SNS) — one version line across
  # all SDK v3 modules so they stay interoperable.
  "@aws-sdk/client-dynamodb": ^3.1141.0
  "@aws-sdk/lib-dynamodb": ^3.1141.0
  "@aws-sdk/client-sns": ^3.1141.0
  "@aws-sdk/client-sqs": ^3.1141.0
  "@aws-sdk/client-apigatewaymanagementapi": ^3.1141.0

  # Lambda event types (APIGatewayProxyEvent, Context…). The `aws-lambda`
  # runtime module itself ships inside the AWS Lambda runtime — never add
  # it as a dependency; only the types package is needed.
  "@types/aws-lambda": ^8.10.150

  # Serverless Framework deploy tooling (root-level, infra only)
  serverless: ^3.38.0
  serverless-esbuild: ^1.54.0
  serverless-prune-plugin: ^2.0.2
  esbuild: ^0.25.0

# @types/multer still depends on the Express-4 type packages internally,
# which drags a second Express type universe into every consumer and breaks
# interface identity (RequestHandler not assignable across universes).
# Override ONLY within @types/multer's subtree.
overrides:
  "@types/multer>@types/express": ^5.0.6
  "@types/multer>@types/express-serve-static-core": ^5.1.3
  "@types/cookie-session>@types/express": ^5.0.6
  "@types/cookie-session>@types/express-serve-static-core": ^5.1.3
