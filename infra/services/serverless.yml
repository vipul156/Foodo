# ─── Foodo services stack (Serverless Framework) ─────────────
# Deploy AFTER the core stack (it consumes its outputs):
#
#   pnpm run deploy:core      # once
#   pnpm run deploy:services
#
# Five Lambda services:
#   auth / restaurant / rider / admin / utils
# Each packages its own src with esbuild (serverless-esbuild) and gets
# only the IAM permissions it actually uses. Realtime stays a
# long-running deployment (ECS/Fargate) — it is NOT in this stack.
#
# Env vars marked ^ require `sls deploy --stage prod` with the real
# secrets set in SSM Parameter Store (securestr) or .env at deploy time.

service: foodo-services
frameworkVersion: "3"

package:
  individually: true

plugins:
  - serverless-esbuild
  - serverless-prune-plugin

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  core: foodo-core-${self:custom.stage}
  esbuild:
    bundle: true
    minify: false
    platform: node
    target: node20
    format: esm
    sourcemap: true
    # workspace packages + aws sdk stay external-free: bundling keeps
    # the deployment zip self-contained (no node_modules layer needed)
    external: []
    packagerOptions:
      scripts:
        - rm -rf node_modules/@aws-sdk/* 2>/dev/null || true
  prune:
    automatic: true
    number: 3

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: ${self:custom.region}
  stage: ${self:custom.stage}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  environment:
    NODE_ENV: production
    STAGE: ${self:custom.stage}
    EVENTS_TOPIC_ARN: ${cf:${self:custom.core}.EventsTopicArn}
    USERS_TABLE: ${cf:${self:custom.core}.UsersTable}
    RESTAURANTS_TABLE: ${cf:${self:custom.core}.RestaurantsTable}
    RIDERS_TABLE: ${cf:${self:custom.core}.RidersTable}
    ORDERS_TABLE: ${cf:${self:custom.core}.OrdersTable}
    MENU_ITEMS_TABLE: ${cf:${self:custom.core}.MenuItemsTable}
    CARTS_TABLE: ${cf:${self:custom.core}.CartsTable}
    ADDRESSES_TABLE: ${cf:${self:custom.core}.AddressesTable}
    WEBHOOK_DEDUPE_TABLE: ${cf:${self:custom.core}.WebhookDedupeTable}
    PAYMENT_QUEUE_URL: ${cf:${self:custom.core}.PaymentQueueUrl}
    ORDER_QUEUE_URL: ${cf:${self:custom.core}.OrderQueueUrl}
    RIDER_EVENTS_QUEUE_URL: ${cf:${self:custom.core}.RiderEventsQueueUrl}
  httpApi:
    payload: "2.0"
    cors:
      allowedOrigins:
        - ${env:FRONTEND_URL, 'http://localhost:3000'}
      allowedHeaders:
        - content-type
        - x-internal-key
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowCredentials: true
  iam:
    role:
      permissionsBoundary: ${env:IAM_PERMISSIONS_BOUNDARY_ARN, ''}

# ─────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────

functions:

  # ─── auth-service ──────────────────────────────────────────
  authHttp:
    handler: src/handlers.auth
    package: { patterns: ['backend/auth-service/dist/**', '!**'] }
    events:
      - httpApi:
          path: /api/auth/{proxy+}
          method: '*'
      - httpApi: { path: /health/auth, method: get }
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
      COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
      REFRESH_COOKIE_NAME: ${env:REFRESH_COOKIE_NAME, 'refresh_token'}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${USERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${USERS_TABLE}/index/*
      - Effect: Allow
        Action: sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  # ─── restaurant-service ────────────────────────────────────
  restaurantHttp:
    handler: src/handlers.restaurant
    package: { patterns: ['backend/restaurant-service/dist/**', '!**'] }
    events:
      - httpApi:
          path: /api/restaurant/{proxy+}
          method: '*'
      - httpApi:
          path: /api/menu-item/{proxy+}
          method: '*'
      - httpApi:
          path: /api/cart/{proxy+}
          method: '*'
      - httpApi:
          path: /api/order/{proxy+}
          method: '*'
      - httpApi:
          path: /api/address/{proxy+}
          method: '*'
      - httpApi: { path: /health/restaurant, method: get }
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
      COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
      INTERNAL_SERVICE_KEY: ${env:INTERNAL_SERVICE_KEY, 'dev-only-change-me'}
      CLOUDINARY_URL: ${env:CLOUDINARY_URL, ''}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MENU_ITEMS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MENU_ITEMS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CARTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ADDRESSES_TABLE}
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
          - dynamodb:Query
        Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CARTS_TABLE}
      - Effect: Allow
        Action:
          - sns:Publish
          - sqs:SendMessage
        Resource:
          - ${cf:${self:custom.core}.EventsTopicArn}
          - ${cf:${self:custom.core}.OrderQueueUrl}

  paymentConsumer:
    handler: src/handlers.paymentConsumer
    timeout: 30
    package: { patterns: ['backend/restaurant-service/dist/**', '!**'] }
    events:
      - sqs:
          arn: !GetAtt PaymentConsumerQueue.Arn
          batchSize: 5
          reportBatchItemFailures: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CARTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}/index/*
      - Effect: Allow
        Action: sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  riderEventsConsumer:
    handler: src/handlers.riderEvents
    timeout: 30
    package: { patterns: ['backend/restaurant-service/dist/**', '!**'] }
    events:
      - sqs:
          arn: !GetAtt RiderEventsConsumerQueue.Arn
          batchSize: 5
          reportBatchItemFailures: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}/index/*
      - Effect: Allow
        Action:
          - sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  # ─── rider-service ─────────────────────────────────────────
  riderHttp:
    handler: src/handlers.rider
    package: { patterns: ['backend/rider-service/dist/**', '!**'] }
    events:
      - httpApi:
          path: /api/rider/{proxy+}
          method: '*'
      - httpApi: { path: /health/rider, method: get }
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
      COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}/index/*
      - Effect: Allow
        Action: sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  orderReadyConsumer:
    handler: src/handlers.orderReady
    timeout: 30
    package: { patterns: ['backend/rider-service/dist/**', '!**'] }
    events:
      - sqs:
          arn: !GetAtt OrderReadyConsumerQueue.Arn
          batchSize: 5
          reportBatchItemFailures: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}/index/*
      - Effect: Allow
        Action: sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  riderEventsConsumerRiderSvc:
    handler: src/handlers.riderEvents
    timeout: 30
    package: { patterns: ['backend/rider-service/dist/**', '!**'] }
    events:
      - sqs:
          arn: !GetAtt RiderEventsConsumerRiderSvcQueue.Arn
          batchSize: 5
          reportBatchItemFailures: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}
      - Effect: Allow
        Action: sns:Publish
        Resource: ${cf:${self:custom.core}.EventsTopicArn}

  # ─── admin-service ─────────────────────────────────────────
  adminHttp:
    handler: src/handlers.admin
    package: { patterns: ['backend/admin-service/dist/**', '!**'] }
    events:
      - httpApi:
          path: /api/admin/{proxy+}
          method: '*'
      - httpApi: { path: /health/admin, method: get }
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
      COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:Query
          - dynamodb:Scan
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${USERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${USERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RESTAURANTS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RIDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}

  # ─── utils-service ─────────────────────────────────────────
  utilsHttp:
    handler: src/handlers.utils
    package: { patterns: ['backend/utils-service/dist/**', '!**'] }
    events:
      - httpApi:
          path: /api/utils/{proxy+}
          method: '*'
      - httpApi: { path: /health/utils, method: get }
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
      COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
      RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
      RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
      RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET, ''}
      FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:3000'}
      CLOUDINARY_URL: ${env:CLOUDINARY_URL, ''}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:PutItem
          - dynamodb:Query
        Resource:
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
          - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WEBHOOK_DEDUPE_TABLE}
      - Effect: Allow
        Action:
          - sns:Publish
          - sqs:SendMessage
        Resource:
          - ${cf:${self:custom.core}.EventsTopicArn}
          - ${cf:${self:custom.core}.PaymentQueueUrl}

  reconcile:
    handler: src/handlers.reconcile
    timeout: 120
    memorySize: 256
    package: { patterns: ['backend/utils-service/dist/**', '!**'] }
    # EventBridge Scheduler — replaces the old setInterval job
    events:
      - schedule: rate(1 hour)
    environment:
      RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
      RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ORDERS_TABLE}/index/*
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource: ${cf:${self:custom.core}.PaymentQueueUrl}

# ─────────────────────────────────────────────────────────────
# SQS event-source queues for the consumers (core stack owns the
# work queues + SNS subscriptions; these are the Lambda triggers)
# ─────────────────────────────────────────────────────────────

resources:
  Resources:
    PaymentConsumerQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-payment-consumer
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PaymentConsumerDLQ.Arn
          maxReceiveCount: 3

    PaymentConsumerDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-payment-consumer-dlq

    RiderEventsConsumerQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-restaurant-rider-events-consumer
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RiderEventsConsumerDLQ.Arn
          maxReceiveCount: 3

    RiderEventsConsumerDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-restaurant-rider-events-consumer-dlq

    OrderReadyConsumerQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-order-ready-consumer
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OrderReadyConsumerDLQ.Arn
          maxReceiveCount: 3

    OrderReadyConsumerDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-order-ready-consumer-dlq

    RiderEventsConsumerRiderSvcQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events-consumer
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RiderEventsConsumerRiderSvcDLQ.Arn
          maxReceiveCount: 3

    RiderEventsConsumerRiderSvcDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events-consumer-dlq

  Outputs:
    ApiGatewayUrl:
      Value: ${cf:food-apigw-${sls:stage}.HttpApiUrl, ''}
    RestaurantRiderEventsQueueConsumer:
      Value: !Ref RiderEventsConsumerQueue
    RiderEventsQueueConsumer:
      Value: !Ref RiderEventsConsumerRiderSvcQueue
