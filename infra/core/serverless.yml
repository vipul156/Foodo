# ─── Foodo core infrastructure stack (Serverless Framework) ──
# Deploy FIRST — the services stack reads these exports.
#
#   pnpm run deploy:core          # stage = dev (default)
#   STAGE=prod pnpm run deploy:core
#
# Everything here is data-tier + event-tier: DynamoDB tables, the SNS
# event topic, SQS work queues + DLQs, and the SNS→SQS fan-out
# subscriptions with filter policies. No Lambda functions live here.

service: foodo-core
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}

resources:
  Resources:

    # ────────────────────────────────────────────────────────
    # DynamoDB tables (PAY_PER_REQUEST; PITR on for prod-grade safety)
    # ────────────────────────────────────────────────────────

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-users
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: email, AttributeType: S }        # email-index
          - { AttributeName: tokenHash, AttributeType: S }    # refresh-index
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - { AttributeName: email, KeyType: HASH }
            Projection: { ProjectionType: ALL }
          - IndexName: refresh-index
            KeySchema:
              - { AttributeName: tokenHash, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        # Refresh-token rows carry a per-item `ttl` attribute — DynamoDB
        # sweeps expired sessions automatically (was $pull-on-access).

    RestaurantsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-restaurants
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: ownerId, AttributeType: S }      # owner-index
          - { AttributeName: isVerified, AttributeType: N }   # verified-index
        GlobalSecondaryIndexes:
          - IndexName: owner-index
            KeySchema:
              - { AttributeName: ownerId, KeyType: HASH }
            Projection: { ProjectionType: ALL }
          - IndexName: verified-index
            KeySchema:
              - { AttributeName: isVerified, KeyType: HASH }
            Projection: { ProjectionType: ALL }

    RidersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-riders
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: userId, AttributeType: S }       # user-index
          - { AttributeName: isVerified, AttributeType: N }   # verified-index
        GlobalSecondaryIndexes:
          - IndexName: user-index
            KeySchema:
              - { AttributeName: userId, KeyType: HASH }
            Projection: { ProjectionType: ALL }
          - IndexName: verified-index
            KeySchema:
              - { AttributeName: isVerified, KeyType: HASH }
            Projection: { ProjectionType: ALL }

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-orders
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: userId, AttributeType: S }        # user-orders
          - { AttributeName: createdAt, AttributeType: S }     # (sort key ×4)
          - { AttributeName: restaurantId, AttributeType: S }  # restaurant-orders
          - { AttributeName: riderId, AttributeType: S }       # rider-orders
          - { AttributeName: status, AttributeType: S }        # status-board
          - { AttributeName: paymentStatus, AttributeType: S } # payment-status
          - { AttributeName: paymentIntentInitiatedAt, AttributeType: S }
        GlobalSecondaryIndexes:
          - IndexName: user-orders
            KeySchema:
              - { AttributeName: userId, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: restaurant-orders
            KeySchema:
              - { AttributeName: restaurantId, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: rider-orders
            KeySchema:
              - { AttributeName: riderId, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: status-board
            KeySchema:
              - { AttributeName: status, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: payment-status
            KeySchema:
              - { AttributeName: paymentStatus, KeyType: HASH }
              - { AttributeName: paymentIntentInitiatedAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        # Unpaid orders carry a per-item `ttl` (the 15-min payment window).
        # markOrderPaid REMOVEs it — swept orders vanish like the old
        # Mongo expireAfterSeconds index did.

    MenuItemsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-menu-items
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
          - { AttributeName: restaurantId, AttributeType: S }
        GlobalSecondaryIndexes:
          - IndexName: restaurant-index
            KeySchema:
              - { AttributeName: restaurantId, KeyType: HASH }
            Projection: { ProjectionType: ALL }

    CartsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-carts
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }

    AddressesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-addresses
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }

    WebhookDedupeTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-webhook-dedupe
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - { AttributeName: eventId, KeyType: HASH }
        AttributeDefinitions:
          - { AttributeName: eventId, AttributeType: S }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ────────────────────────────────────────────────────────
    # Event bus: SNS topic (the RabbitMQ fanout replacement)
    # ────────────────────────────────────────────────────────

    EventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-events

    # ────────────────────────────────────────────────────────
    # SQS work queues (the RabbitMQ work-queue replacement) + DLQs.
    # Redrive policy replaces the RabbitMQ retry-parking-lot: a message
    # that fails maxReceiveCount times lands in the DLQ for inspection.
    # ────────────────────────────────────────────────────────

    PaymentQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-payment-dlq
        MessageRetentionPeriod: 1209600 # 14 days

    PaymentQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-payment
        VisibilityTimeout: 180          # > 6× Lambda timeout
        MessageRetentionPeriod: 345600  # 4 days
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PaymentQueueDLQ.Arn
          maxReceiveCount: 3             # was MAX_RETRIES = 3

    OrderQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-order-dlq
        MessageRetentionPeriod: 1209600

    OrderQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-order
        VisibilityTimeout: 180
        MessageRetentionPeriod: 345600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OrderQueueDLQ.Arn
          maxReceiveCount: 3

    # ────────────────────────────────────────────────────────
    # SNS → SQS fan-out subscriptions with filter policies
    # (the bindQueue half of the old fanout topology)
    # ────────────────────────────────────────────────────────

    # restaurant-service: rider saga + payment-intent stamp events
    RestaurantRiderEventsQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-restaurant-rider-events-dlq
        MessageRetentionPeriod: 1209600

    RestaurantRiderEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-restaurant-rider-events
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RestaurantRiderEventsQueueDLQ.Arn
          maxReceiveCount: 3

    RestaurantRiderEventsSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref EventsTopic
        Protocol: sqs
        Endpoint: !GetAtt RestaurantRiderEventsQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          event:
            - rider.order_accepted
            - rider.order_status_changed
            - payment.intent.created

    # rider-service: saga compensations
    RiderEventsQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events-dlq
        MessageRetentionPeriod: 1209600

    RiderEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RiderEventsQueueDLQ.Arn
          maxReceiveCount: 3

    RiderEventsSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref EventsTopic
        Protocol: sqs
        Endpoint: !GetAtt RiderEventsQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          event:
            - rider.order_rejected
            - order.cancelled
            - order.delivered

    # realtime-service (long-running): poller consumes EVERY event —
    # no filter policy, same as the old fanout exchange binding.
    RealtimeQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-realtime-emit
        VisibilityTimeout: 120

    RealtimeSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref EventsTopic
        Protocol: sqs
        Endpoint: !GetAtt RealtimeQueue.Arn
        RawMessageDelivery: true

  Outputs:
    EventsTopicArn:
      Value: !Ref EventsTopic
      Export:
        Name: ${self:service}-${sls:stage}-EventsTopicArn

    UsersTable:
      Value: ${self:service}-${sls:stage}-users
      Export:
        Name: ${self:service}-${sls:stage}-UsersTable

    RestaurantsTable:
      Value: ${self:service}-${sls:stage}-restaurants
      Export:
        Name: ${self:service}-${sls:stage}-RestaurantsTable

    RidersTable:
      Value: ${self:service}-${sls:stage}-riders
      Export:
        Name: ${self:service}-${sls:stage}-RidersTable

    OrdersTable:
      Value: ${self:service}-${sls:stage}-orders
      Export:
        Name: ${self:service}-${sls:stage}-OrdersTable

    MenuItemsTable:
      Value: ${self:service}-${sls:stage}-menu-items
      Export:
        Name: ${self:service}-${sls:stage}-MenuItemsTable

    CartsTable:
      Value: ${self:service}-${sls:stage}-carts
      Export:
        Name: ${self:service}-${sls:stage}-CartsTable

    AddressesTable:
      Value: ${self:service}-${sls:stage}-addresses
      Export:
        Name: ${self:service}-${sls:stage}-AddressesTable

    WebhookDedupeTable:
      Value: ${self:service}-${sls:stage}-webhook-dedupe
      Export:
        Name: ${self:service}-${sls:stage}-WebhookDedupeTable

    PaymentQueueUrl:
      Value: !Ref PaymentQueue
      Export:
        Name: ${self:service}-${sls:stage}-PaymentQueueUrl

    OrderQueueUrl:
      Value: !Ref OrderQueue
      Export:
        Name: ${self:service}-${sls:stage}-OrderQueueUrl

    RestaurantRiderEventsQueueUrl:
      Value: !Ref RestaurantRiderEventsQueue
      Export:
        Name: ${self:service}-${sls:stage}-RestaurantRiderEventsQueueUrl

    RiderEventsQueueUrl:
      Value: !Ref RiderEventsQueue
      Export:
        Name: ${self:service}-${sls:stage}-RiderEventsQueueUrl

    RealtimeQueueUrl:
      Value: !Ref RealtimeQueue
      Export:
        Name: ${self:service}-${sls:stage}-RealtimeQueueUrl