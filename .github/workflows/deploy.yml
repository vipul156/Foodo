name: Deploy All Foodo Services

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      restaurant: ${{ steps.filter.outputs.restaurant }}
      rider: ${{ steps.filter.outputs.rider }}
      admin: ${{ steps.filter.outputs.admin }}
      utils: ${{ steps.filter.outputs.utils }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: 'auth/**'
            restaurant: 'restaurant/**'
            rider: 'rider/**'
            admin: 'admin/**'
            utils: 'utils/**'
            frontend: 'frontend/**'

  deploy-backend:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            function_name: foodo-auth-service
            changed: ${{ needs.changes.outputs.auth }}
          - service: restaurant
            function_name: foodo-restaurant-service
            changed: ${{ needs.changes.outputs.restaurant }}
          - service: rider
            function_name: foodo-rider-service
            changed: ${{ needs.changes.outputs.rider }}
          - service: admin
            function_name: foodo-admin-service
            changed: ${{ needs.changes.outputs.admin }}
          - service: utils
            function_name: foodo-utils-service
            changed: ${{ needs.changes.outputs.utils }}

    steps:
      # Condition moved to step-level where `matrix` is in scope
      - name: Check if service changed
        id: check_changed
        run: |
          if [ "${{ matrix.changed }}" != "true" ]; then
            echo "No changes in ${{ matrix.service }}. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Code
        if: steps.check_changed.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: steps.check_changed.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Install Dependencies
        if: steps.check_changed.outputs.skip != 'true'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Bundle with tsup
        if: steps.check_changed.outputs.skip != 'true'
        working-directory: ${{ matrix.service }}
        run: |
          npx tsup src/index.ts \
            --format esm \
            --target node20 \
            --clean \
            --minify \
            --no-splitting \
            --out-dir dist

      - name: Package Lambda Zip
        if: steps.check_changed.outputs.skip != 'true'
        working-directory: ${{ matrix.service }}/dist
        run: zip -r ../function.zip index.mjs

      - name: Authenticate to AWS (OIDC)
        if: steps.check_changed.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Deploy Code to AWS Lambda
        if: steps.check_changed.outputs.skip != 'true'
        working-directory: ${{ matrix.service }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function_name }} \
            --zip-file fileb://function.zip

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build

      - name: Deploy Frontend
        run: |
          echo "Frontend built successfully. Deploying..."