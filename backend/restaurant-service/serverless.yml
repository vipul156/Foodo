# ─── Foodo restaurant service stack ──────────────────────────
# Routes: public menu/restaurant browsing is carved out explicitly;
# everything else on the five mounted routers requires a valid JWT
# at the gateway (the in-app isSeller/isAuth guards remain the
# authority for roles). The internal payment claim endpoint
# authenticates via x-internal-key, not a user session, so it is
# also public at the gateway.
#
# Events: the rider/payment events arrive on a direct SNS
# subscription (push) with their own filter policy + DLQ.
# paymentConsumer consumes the SHARED payment work queue
# (foodo-infra) directly.
#
#   turbo run deploy --filter=@foodo/restaurant-service

service: foodo-restaurant
frameworkVersion: "3"
useDotenv: true

plugins:
  - serverless-prune-plugin

package:
  individually: true

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  infra: foodo-infra-${self:custom.stage}
  coreApi: foodo-core-api-${self:custom.stage}
  prune:
    automatic: true
    number: 3

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${self:custom.region}
  stage: ${self:custom.stage}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  environment:
    NODE_ENV: production
    STAGE: ${self:custom.stage}
    JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
    COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
    # Same secret as every sibling stack. The old `dev-only-change-me`
    # fallback was a published value on a money path (it gates the
    # payment claim) and guaranteed a 403 mismatch with any service that
    # used the real key, so the value is now required, not defaulted.
    INTERNAL_SERVICE_KEY: ${env:INTERNAL_SERVICE_KEY}
    CLOUDINARY_URL: ${env:CLOUDINARY_URL, ''}    # signed direct uploads (parsed by the shared signer)
    # Root asset namespace for this stack, e.g. "foodo" → foodo/menu-items.
    CLOUDINARY_FOLDER: ${env:CLOUDINARY_FOLDER, 'foodo'}
    # The AI verification tier lives on the same shared HTTP API; the
    # kitchen proxies packing checks there server-side.
    AI_VERIFICATION_URL: ${cf:${self:custom.coreApi}.HttpApiUrl}
    USERS_TABLE: ${cf:${self:custom.infra}.UsersTable}
    RESTAURANTS_TABLE: ${cf:${self:custom.infra}.RestaurantsTable}
    ORDERS_TABLE: ${cf:${self:custom.infra}.OrdersTable}
    MENU_ITEMS_TABLE: ${cf:${self:custom.infra}.MenuItemsTable}
    CARTS_TABLE: ${cf:${self:custom.infra}.CartsTable}
    ADDRESSES_TABLE: ${cf:${self:custom.infra}.AddressesTable}
    EVENTS_TOPIC_ARN: ${cf:${self:custom.infra}.EventsTopicArn}
    PAYMENT_QUEUE_URL: ${cf:${self:custom.infra}.PaymentQueueUrl}
    ORDER_QUEUE_URL: ${cf:${self:custom.infra}.OrderQueueUrl}
  httpApi:
    id: ${cf:${self:custom.coreApi}.HttpApiId}
  iam:
    role:
      permissionsBoundary: ${env:IAM_PERMISSIONS_BOUNDARY_ARN, null}
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.OrdersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.OrdersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.MenuItemsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.MenuItemsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.CartsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.AddressesTable}
        - Effect: Allow
          Action:
            - sns:Publish
            - sqs:SendMessage
          Resource:
            - ${cf:${self:custom.infra}.EventsTopicArn}
            - ${cf:${self:custom.infra}.OrderQueueArn}

resources:
  Resources:
    # ── Inbound fan-out: direct SNS subscription (see the
    #    riderEventsConsumer event) — the filter policy lives on the
    #    subscription now, not on an SQS queue we would poll 24/7.
    #    The DLQ is storage only: free while idle.
    RiderEventsQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events-dlq
        MessageRetentionPeriod: 1209600

functions:
  http:
    handler: dist/http.handler
    # The packing gate proxies to ai-verification and aborts at
    # VERIFICATION_TIMEOUT_MS (25s default). The function has to outlive
    # that abort, or a slow vision call kills the Lambda and the seller
    # gets a dead 502 instead of the explanation.
    timeout: 30
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      # ── Public: anonymous browsing + internal payment claim ──
      - httpApi:
          path: /api/restaurant/all
          method: get
      - httpApi:
          path: /api/restaurant/nearby
          method: get
      - httpApi:
          path: /api/restaurant/{id}
          method: get
      - httpApi:
          path: /api/menu-item/all/{id}
          method: get
      - httpApi:
          path: /api/order/payment/claim/{orderId}
          method: post
      - httpApi:
          path: /health/restaurant
          method: get
      # ── Protected: everything else on the five routers ──────
      # /restaurant/my and /restaurant/upload-signature are declared
      # explicitly: without them they'd match the PUBLIC /{id} GET
      # route above and skip the authorizer. (Literal beats {proxy+}
      # and {var} in API Gateway route selection.)
      - httpApi:
          path: /api/restaurant/my
          method: get
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/restaurant/upload-signature
          method: get
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/restaurant/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/menu-item/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/cart/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/order/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /api/address/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}

  paymentConsumer:
    handler: dist/paymentConsumer.handler
    timeout: 30
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      # Consumes the shared payment work queue directly — no
      # intermediate trigger queue.
      - sqs:
          arn: ${cf:${self:custom.infra}.PaymentQueueArn}
          batchSize: 5
          # The poller fills a batch for free when 5 items are already
          # queued; the window only buys the PARTIAL batch, so 5 s is the
          # whole saving (a rush of payment items → one invocation, one
          # ReceiveMessage instead of one per item). Latency cost: up to
          # 5 s before the cart is cleared and the kitchen socket fires.
          maximumBatchingWindow: 5
          functionResponseType: ReportBatchItemFailures

  riderEventsConsumer:
    handler: dist/riderEventsConsumer.handler
    timeout: 30
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      # Rider/domain events, pushed straight from the event topic: one
      # invocation per matching event, no queue to poll at rest. The
      # filter policy is identical to the SQS subscription it replaces.
      - sns:
          arn: ${cf:${self:custom.infra}.EventsTopicArn}
          filterPolicy:
            event:
              - rider.order_accepted
              - rider.order_status_changed
              - payment.intent.created
          redrivePolicy:
            deadLetterTargetRef: RiderEventsQueueDLQ
