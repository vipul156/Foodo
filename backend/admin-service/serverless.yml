# ─── Foodo admin service stack ───────────────────────────────
# The admin router applies `router.use(isAuth, isAdmin)` — every
# route requires an authenticated admin, so one protected
# catch-all covers the whole surface.
#
#   turbo run deploy --filter=@foodo/admin-service

service: foodo-admin
frameworkVersion: "3"
useDotenv: true

plugins:
  - serverless-prune-plugin

package:
  individually: true

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  infra: foodo-infra-${self:custom.stage}
  coreApi: foodo-core-api-${self:custom.stage}
  prune:
    automatic: true
    number: 3

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${self:custom.region}
  stage: ${self:custom.stage}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  environment:
    NODE_ENV: production
    STAGE: ${self:custom.stage}
    JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
    COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
    USERS_TABLE: ${cf:${self:custom.infra}.UsersTable}
    RESTAURANTS_TABLE: ${cf:${self:custom.infra}.RestaurantsTable}
    RIDERS_TABLE: ${cf:${self:custom.infra}.RidersTable}
    ORDERS_TABLE: ${cf:${self:custom.infra}.OrdersTable}
    # AI escalation queue: where the arbitration agent parks the cases it
    # can't decide alone. A table, not a service hop — the admin work list
    # is one query against the shared data plane.
    REVIEW_QUEUE_TABLE: ${cf:${self:custom.infra}.ReviewQueueTable}
    # Dispatch swarm ops read. ai-dispatch gates its snapshot with
    # `x-internal-key`; it lives on the same shared HTTP API.
    #
    # No fallback, on purpose: an empty key reads as "not configured"
    # here (503) and as "wrong key" at the swarm (403). Both are runtime
    # symptoms of a deploy that had no secret to hand out, so the stack
    # refuses to deploy instead of shipping a view that can never load.
    INTERNAL_SERVICE_KEY: ${env:INTERNAL_SERVICE_KEY}
    # The one API every service attaches to (core's HttpApiUrl). The
    # /api/dispatch route carries no gateway authorizer — the key above
    # is the only door, which is why the two must come from one secret.
    DISPATCH_SERVICE_URL: ${cf:${self:custom.coreApi}.HttpApiUrl}
  httpApi:
    id: ${cf:${self:custom.coreApi}.HttpApiId}
  iam:
    role:
      permissionsBoundary: ${env:IAM_PERMISSIONS_BOUNDARY_ARN, null}
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.UsersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.UsersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.RidersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.RidersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.OrdersTable}
            # Review queue: the admin work list reads pending items and
            # closes them (status-board GSI included).
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.ReviewQueueTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.ReviewQueueTable}

functions:
  http:
    handler: dist/index.handler
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      - httpApi:
          path: /api/admin/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /health/admin
          method: get
