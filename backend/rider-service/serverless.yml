# ─── Foodo rider service stack ───────────────────────────────
# The rider router applies `router.use(isAuth, isRider)` — the
# ENTIRE /api/rider surface is authenticated, so it gets one
# protected catch-all at the gateway. (Yes, that includes rider
# registration — current app semantics, preserved.)
#
# Events: orderReadyConsumer consumes the SHARED order work queue
# (foodo-infra) directly; the saga compensation events arrive on a
# direct SNS subscription (push), with their filter policy and DLQ
# declared below.
#
#   turbo run deploy --filter=@foodo/rider-service

service: foodo-rider
frameworkVersion: "3"
useDotenv: true

plugins:
  - serverless-prune-plugin

package:
  individually: true

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  infra: foodo-infra-${self:custom.stage}
  coreApi: foodo-core-api-${self:custom.stage}
  prune:
    automatic: true
    number: 3

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${self:custom.region}
  stage: ${self:custom.stage}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  environment:
    NODE_ENV: production
    STAGE: ${self:custom.stage}
    JWT_SECRET: ${env:JWT_SECRET, 'dev-only-change-me'}
    COOKIE_SECRET: ${env:COOKIE_SECRET, 'dev-only-change-me'}
    CLOUDINARY_URL: ${env:CLOUDINARY_URL, ''}   # signed direct uploads (upload-signature)
    # Root asset namespace for this stack, e.g. "foodo" → foodo/riders/kyc.
    CLOUDINARY_FOLDER: ${env:CLOUDINARY_FOLDER, 'foodo'}
    INTERNAL_SERVICE_KEY: ${env:INTERNAL_SERVICE_KEY, ''}  # ai-verification calls (proof of delivery)
    # The AI verification tier lives on the same shared HTTP API.
    AI_VERIFICATION_URL: ${cf:${self:custom.coreApi}.HttpApiUrl}
    RIDERS_TABLE: ${cf:${self:custom.infra}.RidersTable}
    ORDERS_TABLE: ${cf:${self:custom.infra}.OrdersTable}
    RESTAURANTS_TABLE: ${cf:${self:custom.infra}.RestaurantsTable}
    EVENTS_TOPIC_ARN: ${cf:${self:custom.infra}.EventsTopicArn}
  httpApi:
    id: ${cf:${self:custom.coreApi}.HttpApiId}
  iam:
    role:
      permissionsBoundary: ${env:IAM_PERMISSIONS_BOUNDARY_ARN, null}
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.RidersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.RidersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.OrdersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.OrdersTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
            - Fn::Sub:
                - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                - TableName: ${cf:${self:custom.infra}.RestaurantsTable}
        - Effect: Allow
          Action: sns:Publish
          Resource: ${cf:${self:custom.infra}.EventsTopicArn}

resources:
  Resources:
    # ── Inbound fan-out: direct SNS subscription (see the
    #    riderEventsConsumer event). Only the DLQ is left as a queue:
    #    it is storage, not a poller, so it costs nothing while idle.
    RiderEventsQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-rider-events-dlq
        MessageRetentionPeriod: 1209600

functions:
  http:
    handler: dist/http.handler
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      - httpApi:
          path: /api/rider/{proxy+}
          method: '*'
          authorizer:
            type: request
            id: ${cf:${self:custom.coreApi}.AuthorizerId}
      - httpApi:
          path: /health/rider
          method: get

  orderReadyConsumer:
    handler: dist/orderReadyConsumer.handler
    timeout: 30
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      # Consumes the shared order work queue directly — no
      # intermediate trigger queue.
      - sqs:
          arn: ${cf:${self:custom.infra}.OrderQueueArn}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  riderEventsConsumer:
    handler: dist/riderEventsConsumer.handler
    timeout: 30
    package:
      patterns:
        - "!**"
        - dist/**
    events:
      # Saga compensations, pushed straight from the event topic: one
      # invocation per matching event, no queue to poll at rest. The
      # filter policy is identical to the SQS subscription it replaces.
      - sns:
          arn: ${cf:${self:custom.infra}.EventsTopicArn}
          filterPolicy:
            event:
              - rider.order_rejected
              - order.cancelled
              - order.delivered
          redrivePolicy:
            deadLetterTargetRef: RiderEventsQueueDLQ
